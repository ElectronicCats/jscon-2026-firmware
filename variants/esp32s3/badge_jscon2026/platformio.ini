; Badge JSCON 2026 - Electronic Cats
; ESP32-S3-WROOM-1-N8: 8 MB flash, no PSRAM.
[env:badge_jscon2026]
extends = esp32s3_base
board = esp32-s3-devkitc-1
board_build.partitions = default_8MB.csv
board_upload.flash_size = 8MB

build_flags =
    ${esp32s3_base.build_flags}
    -DBADGE_JSCON2026
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DUSE_SX1262
    -I variants/esp32s3/badge_jscon2026

    ; RAM diet. The packet pool is sized for phone-scale deployments by
    ; default; these values cut it from roughly 26 KB to roughly 11 KB.
    ; Every kilobyte saved here is available to the JS heap later.
    -DMAX_RX_TOPHONE=8
    -DMAX_TX_QUEUE=8

    ; Modules this badge does not ship.
    -DMESHTASTIC_EXCLUDE_MQTT=1
    -DMESHTASTIC_EXCLUDE_WEBSERVER=1
    -DMESHTASTIC_EXCLUDE_PAXCOUNTER=1
    -DMESHTASTIC_EXCLUDE_STOREFORWARD=1
    -DMESHTASTIC_EXCLUDE_AUDIO=1
    -DMESHTASTIC_EXCLUDE_ATAK=1
    -DMESHTASTIC_EXCLUDE_RANGETEST=1
    -DMESHTASTIC_EXCLUDE_TRACEROUTE=1
    -DMESHTASTIC_EXCLUDE_WAYPOINT=1
    -DMESHTASTIC_EXCLUDE_DETECTIONSENSOR=1
    -DMESHTASTIC_EXCLUDE_NEIGHBORINFO=1
    -DMESHTASTIC_EXCLUDE_EXTERNALNOTIFICATION=1
    ; Disables the UART passthrough module only. Does not affect
    ; Serial.print() or the USB CDC console.
    -DMESHTASTIC_EXCLUDE_SERIAL=1

    ; Smaller runtime buffers.
    -DMESSAGE_HISTORY_LIMIT=10
    ; NOTE: -DSERIAL_BUFFER_SIZE=1024 from the brief was dropped. esp32s3_base
    ; already sets -DSERIAL_BUFFER_SIZE=4096; duplicating it with a different
    ; value here does not override it (both come from the command line) and
    ; makes cc1 emit a "SERIAL_BUFFER_SIZE redefined" warning, which several
    ; ESP-IDF wpa_supplicant translation units build with -Werror, turning it
    ; into a hard error and failing the whole build. See task-2 report.

lib_deps = ${esp32s3_base.lib_deps}
  ; NOTE: the brief specified the meshtastic/Arduino_GFX fork at commit
  ; 054e81ffaf23784830a734e3c184346789349406, but that fork's
  ; Arduino_ESP32SPI/Arduino_ESP32SPIDMA call spiFrequencyToClockDiv() with
  ; the old single-argument signature, which no longer matches this repo's
  ; pinned framework-arduinoespressif32 esp32-hal-spi.h (now
  ; spiFrequencyToClockDiv(spi_t *spi, uint32_t freq)) and fails to build.
  ; hackaday-communicator, which uses the same NV3007 panel and controller
  ; class, pins moononournation/Arduino_GFX v1.6.5 instead, which does match
  ; the current framework and already builds successfully. Reusing that
  ; proven version here. See task-2 report.
  # renovate: datasource=git-refs depName=moononournation-Arduino_GFX packageName=https://github.com/moononournation/Arduino_GFX gitBranch=master
  https://github.com/moononournation/Arduino_GFX/archive/refs/tags/v1.6.5.zip
